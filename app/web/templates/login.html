<!doctype html>
<html>
<head>

  <link rel="stylesheet" href="/static/styles.css">
  <title>Login</title>

<body class="wrap">
  <h1>Вход</h1>

  <p><a href="/register">Регистрация</a></p>
</body>
</html>
